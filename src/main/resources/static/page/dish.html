<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>菜品列表</title>
    <link rel="stylesheet" href="/food/css/dish.css">
</head>
<body>
<div class="dish-container">
    <div class="dish-header">
        <button class="back-btn" onclick="backToCategory()">← 返回分类</button>
        <h2 id="categoryTitle">菜品列表</h2>
    </div>
    <div class="dish-list" id="dishList">
        <div class="loading">加载中...</div>
    </div>
</div>

<script>
    // 页面加载时显示对应分类的菜品
    document.addEventListener('DOMContentLoaded', function() {
        console.log('=== dish.html DOMContentLoaded ===');

        const catId = sessionStorage.getItem('catId');
        const catName = sessionStorage.getItem('catName');

        console.log('从sessionStorage获取:', {catId, catName});

        // 设置分类标题
        const titleEl = document.getElementById('categoryTitle');
        if (catName) {
            titleEl.textContent = catName;
        }

        // 加载菜品数据
        if (catId) {
            console.log('开始加载分类ID为', catId, '的菜品');
            // 调用fram.js中的函数
            if (typeof loadDishesByCategory === 'function') {
                loadDishesByCategory(catId);
            } else {
                console.error('loadDishesByCategory函数未定义');
            }
        } else {
            console.error('未找到分类ID');
            document.getElementById('dishList').innerHTML = '<div class="error">未选择分类</div>';
        }
    });

    // 返回分类
    function backToCategory() {
        console.log('返回分类页面');
        if (typeof loadPage === 'function') {
            loadPage('category');
        } else {
            window.history.back();
        }
    }

    // 暴露到全局
    window.backToCategory = backToCategory;
</script>
</body>
</html>
