<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>菜品详情</title>
    <link rel="stylesheet" href="/food/css/dish-detail.css">
</head>
<body>
<div class="detail-container">
    <div class="detail-header">
        <button class="back-btn" onclick="backToDishList()">← 返回列表</button>
        <h1 id="dishTitle">菜品详情</h1>
    </div>

    <div class="detail-content">
        <div class="image-section">
            <img id="dishImage" src="" alt="" class="dish-image">
        </div>
        <div class="info-section">
            <h1 id="dishName">菜品名称</h1>
            <p id="dishDescription" class="description">菜品描述加载中...</p>
            <p class="price" id="dishPrice">¥0.00</p>
            <p id="dishStock" class="stock">库存: 0</p>
            <p id="dishCanteen" class="canteen">食堂: 加载中...</p>

            <div class="action-buttons">
                <div class="quantity-selector">
                    <label>数量: </label>
                    <input type="number" id="quantity" value="1" min="1" max="99">
                </div>
                <button class="add-to-cart-btn" onclick="addToCartFromDetail()">加入购物车</button>
            </div>
        </div>
    </div>

    <div class="reviews-section">
        <h3>用户评价</h3>
        <div class="review-form">
            <h4>发表评价</h4>
            <div class="form-group">
                <label>评分: </label>
                <select id="rating">
                    <option value="5">★★★★★ 5星</option>
                    <option value="4">★★★★☆ 4星</option>
                    <option value="3">★★★☆☆ 3星</option>
                    <option value="2">★★☆☆☆ 2星</option>
                    <option value="1">★☆☆☆☆ 1星</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="comment" placeholder="写下您的评价..." rows="3"></textarea>
            </div>
            <button class="submit-review-btn" onclick="submitReview()">提交评价</button>
        </div>
        <div id="reviewsList">
            <div class="loading">加载评价中...</div>
        </div>
    </div>
</div>

<script>
    // 页面加载时获取菜品详情
    document.addEventListener('DOMContentLoaded', function() {
        const dishId = sessionStorage.getItem('selectedDishId');
        console.log('加载菜品详情，ID:', dishId);
        if (dishId) {
            loadDishDetail(dishId);
            loadReviews(dishId);
        } else {
            document.getElementById('dishName').textContent = '未选择菜品';
        }
    });

    function loadDishDetail(dishId) {
        fetch(`/food/dishes/${dishId}/detail`)
            .then(r => {
                if (!r.ok) throw new Error('加载失败');
                return r.json();
            })
            .then(dish => {
                console.log('菜品详情数据:', dish);
                document.getElementById('dishName').textContent = dish.name;
                document.getElementById('dishTitle').textContent = dish.name;
                document.getElementById('dishDescription').textContent = dish.description || '暂无描述';
                document.getElementById('dishPrice').textContent = '¥' + dish.price;
                document.getElementById('dishStock').textContent = '库存: ' + dish.stock;
                document.getElementById('dishCanteen').textContent = '食堂: ' + dish.canteenName;

                const img = document.getElementById('dishImage');
                if (dish.imageUrl) {
                    img.src = dish.imageUrl;
                } else {
                    img.src = 'https://picsum.photos/400/300?random=' + dishId;
                }
                img.alt = dish.name;
            })
            .catch(err => {
                console.error('加载菜品详情失败:', err);
                document.getElementById('dishName').textContent = '加载失败';
            });
    }

    function loadReviews(dishId) {
        fetch(`/food/reviews/dish/${dishId}`)
            .then(r => {
                if (!r.ok) throw new Error('加载失败');
                return r.json();
            })
            .then(reviews => {
                const reviewsList = document.getElementById('reviewsList');
                if (!reviews || reviews.length === 0) {
                    reviewsList.innerHTML = '<div class="no-reviews">暂无评价</div>';
                    return;
                }

                reviewsList.innerHTML = reviews.map(review => `
                    <div class="review-item">
                        <div class="review-header">
                            <strong>${review.userName}</strong>
                            <span class="rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span>
                            <small>${new Date(review.createTime).toLocaleDateString()}</small>
                        </div>
                        <p class="review-comment">${review.comment}</p>
                    </div>
                `).join('');
            })
            .catch(err => {
                console.error('加载评价失败:', err);
                document.getElementById('reviewsList').innerHTML = '<div class="error">加载评价失败</div>';
            });
    }

    function addToCartFromDetail() {
        const dishId = sessionStorage.getItem('selectedDishId');
        const quantity = parseInt(document.getElementById('quantity').value) || 1;

        if (!dishId) {
            alert('未选择菜品');
            return;
        }

        console.log('添加到购物车:', dishId, quantity);
        addToCart(dishId, quantity);
    }

    function submitReview() {
        const dishId = sessionStorage.getItem('selectedDishId');
        const rating = parseInt(document.getElementById('rating').value);
        const comment = document.getElementById('comment').value.trim();

        if (!dishId) {
            alert('未选择菜品');
            return;
        }

        if (!comment) {
            alert('请输入评价内容');
            return;
        }

        fetch('/food/reviews', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                dishId: dishId,
                rating: rating,
                comment: comment
            })
        })
            .then(r => {
                if (!r.ok) throw new Error('提交失败');
                return r.json();
            })
            .then(() => {
                alert('评价提交成功！');
                document.getElementById('comment').value = '';
                loadReviews(dishId); // 重新加载评价列表
            })
            .catch(err => {
                console.error('提交评价失败:', err);
                alert('提交失败: ' + err.message);
            });
    }

    function backToDishList() {
        loadPage('dish');
    }

    // 暴露函数到全局
    window.addToCartFromDetail = addToCartFromDetail;
    window.submitReview = submitReview;
    window.backToDishList = backToDishList;
</script>
</body>
</html>
