spring.application.name=SchoolWaimai
server.port=8080
server.servlet.context-path=/food

spring.datasource.url=jdbc:mysql://localhost:3306/canteen_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.output.ansi.enabled=always


logging.level.org.hibernate.SQL=debug
logging.level.com.zaxxer.hikari=warn


file.upload-dir=./src/main/resources/static/uploads/



spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB